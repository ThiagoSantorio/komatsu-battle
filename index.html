<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Komatsu · Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0e14;
    --bg-card: #11161e;
    --border: #1f2937;
    --border-strong: #2d3a4f;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --text-mute: #64748b;
    --yellow: #ffb81c;
    --exc: #3b82f6;
    --car: #f59e0b;
    --mot: #10b981;
    --tra: #ef4444;
    --green: #10b981;
    --red: #ef4444;
  }

  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 15px;
    min-height: 100vh; overscroll-behavior: none;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,184,28,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 100%, rgba(20,10,154,.1) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }

  .app-loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px;
  }
  .app-loading .brand-mark {
    width: 48px; height: 48px; background: var(--yellow); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; color: #000; font-size: 26px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
  .app-loading p { color: var(--text-mute); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

  /* HEADER */
  .header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,20,.96);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; background: var(--yellow); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; color: #000; font-size: 17px;
  }
  .brand-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 1px; }
  .brand-text span { color: var(--yellow); }
  .user-pill { font-size: 11px; color: var(--text-dim); padding: 3px 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 100px; }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; margin-bottom: 3px; }
  .header-sub { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.5px; }

  /* TABS */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; margin: 16px 20px 0;
  }
  .tab {
    flex: 1; background: none; border: none; color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 9px 4px; border-radius: 7px; cursor: pointer; transition: all .18s;
  }
  .tab.active { background: var(--yellow); color: #000; }

  .main { padding: 16px 20px; }
  .screen { display: none; animation: fadeIn .22s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* CATEGORY SELECTOR */
  .cat-label {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 8px; margin-top: 4px;
  }
  .cat-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat-pill {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); padding: 6px 12px; border-radius: 100px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .cat-pill.active { background: var(--yellow); color: #000; border-color: var(--yellow); }

  /* CARDS */
  .step { margin-bottom: 20px; }
  .step-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--yellow); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 9px;
  }
  .step-label::before { content: ''; width: 14px; height: 2px; background: var(--yellow); }

  .machine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .machine-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px; cursor: pointer; transition: all .16s; text-align: left; color: var(--text); font-family: inherit;
  }
  .machine-card:active { transform: scale(.97); }
  .machine-card.selected { border-color: var(--yellow); background: rgba(255,184,28,.06); box-shadow: 0 0 0 1px var(--yellow); }
  .machine-card.disabled { opacity: .3; cursor: not-allowed; pointer-events: none; }

  .m-cat { font-size: 9px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; font-weight: 500; }
  .m-model { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; line-height: 1; margin-bottom: 7px; }
  .m-meta { font-size: 10px; color: var(--text-dim); }
  .brand-tag { display: inline-block; font-size: 8px; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; }
  .brand-tag.komatsu { background: var(--yellow); color: #000; }
  .brand-tag.john_deere { background: #367c2b; color: #fff; }

  .compare-btn {
    width: 100%; background: var(--yellow); color: #000; border: none;
    padding: 15px; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 17px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all .15s; margin-top: 6px;
  }
  .compare-btn:disabled { background: var(--bg-card); color: var(--text-mute); border: 1px solid var(--border); cursor: not-allowed; }
  .compare-btn:not(:disabled):active { transform: scale(.98); }

  .back-btn {
    background: none; border: none; color: var(--text-dim); font-family: inherit;
    font-size: 12px; padding: 0; margin-bottom: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }

  /* VERSUS */
  .versus {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center;
  }
  .versus-side { text-align: center; }
  .versus-side .m-model { font-size: 15px; margin-bottom: 0; }
  .versus-x { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--yellow); }

  .compare-table { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .compare-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; border-bottom: 1px solid var(--border); }
  .compare-row:last-child { border-bottom: none; }
  .compare-row.hdr { background: rgba(255,184,28,.04); border-bottom: 1px solid var(--border-strong); }
  .compare-row.hdr .cell { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 11px 8px; }
  .compare-row.hdr .cell.label { text-align: left; color: var(--text-mute); }
  .compare-row.hdr .cell.km { color: var(--yellow); }
  .cell { padding: 10px 9px; font-size: 12px; border-right: 1px solid var(--border); }
  .cell:last-child { border-right: none; }
  .cell.label { color: var(--text-dim); font-size: 10.5px; line-height: 1.3; display: flex; align-items: center; }
  .cell.value { text-align: center; font-weight: 600; color: var(--text); font-size: 12px; line-height: 1.3; }
  .cell.value.empty { color: var(--text-mute); font-weight: 400; }

  .pro-block { background: linear-gradient(135deg, rgba(255,184,28,.1), rgba(255,184,28,.02)); border: 1px solid rgba(255,184,28,.3); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .pro-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 2px; color: var(--yellow); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .pro-title::before { content: '✦'; font-size: 12px; }
  .pro-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .pro-list li { font-size: 12.5px; line-height: 1.45; color: var(--text); padding-left: 18px; position: relative; }
  .pro-list li::before { content: ''; position: absolute; left: 0; top: 8px; width: 9px; height: 2px; background: var(--yellow); }
  .pro-list li strong { color: var(--yellow); font-weight: 700; }

  .warning { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 10px; padding: 11px 13px; font-size: 11px; color: #fca5a5; line-height: 1.4; margin-bottom: 14px; }
  .footnote { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 10.5px; color: var(--text-dim); line-height: 1.4; margin-bottom: 9px; }
  .footnote-mark { color: var(--yellow); font-weight: 700; margin-right: 3px; }
  .footnote strong { color: var(--text); font-weight: 600; }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; }
  .search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 40px 12px 40px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color .15s; }
  .search-input:focus { border-color: var(--yellow); }
  .search-input::placeholder { color: var(--text-mute); }
  .search-clear { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); background: var(--border-strong); border: none; color: var(--text); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 11px; padding: 0; }
  .search-clear.visible { display: flex; }

  .filter-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 10px; border-radius: 100px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .chip.active { background: var(--yellow); color: #000; border-color: var(--yellow); }

  .results-count { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 10px; }
  .results-count span { color: var(--yellow); }

  .search-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 9px; }
  .search-card-head { margin-bottom: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
  .search-card .m-model { font-size: 17px; margin-bottom: 3px; }
  .section-tag { display: inline-block; font-size: 8.5px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; background: var(--bg); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); margin-bottom: 5px; }
  .spec-hit-section { margin-top: 7px; }
  .spec-hit-section:first-child { margin-top: 0; }
  .spec-hit { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 9px; background: rgba(255,184,28,.04); border-radius: 5px; border-left: 2px solid var(--yellow); margin-bottom: 3px; }
  .spec-hit-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; line-height: 1.3; align-self: center; }
  .spec-hit-value { font-size: 12px; font-weight: 600; color: var(--text); text-align: right; line-height: 1.3; }
  .spec-hit mark { background: var(--yellow); color: #000; padding: 1px 3px; border-radius: 2px; font-weight: 700; }

  .empty-state { text-align: center; padding: 36px 20px; color: var(--text-mute); font-size: 12px; line-height: 1.7; }
  .empty-icon { font-size: 30px; margin-bottom: 7px; opacity: .5; }
  .suggest-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
  .suggest { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 9px; border-radius: 100px; font-size: 10px; cursor: pointer; font-family: inherit; }
  .suggest:active { background: var(--yellow); color: #000; }

  /* AGENTES */
  .agents-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .agent-card {
    border-radius: 12px; padding: 14px; cursor: pointer; transition: all .18s;
    border: 2px solid transparent; text-align: left; font-family: inherit; color: var(--text);
  }
  .agent-card.exc { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.2); }
  .agent-card.car { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.2); }
  .agent-card.mot { background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.2); }
  .agent-card.tra { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.2); }
  .agent-card.active.exc { border-color: var(--exc); box-shadow: 0 0 0 1px var(--exc); }
  .agent-card.active.car { border-color: var(--car); box-shadow: 0 0 0 1px var(--car); }
  .agent-card.active.mot { border-color: var(--mot); box-shadow: 0 0 0 1px var(--mot); }
  .agent-card.active.tra { border-color: var(--tra); box-shadow: 0 0 0 1px var(--tra); }
  .agent-card:active { transform: scale(.97); }
  .agent-icon { font-size: 24px; margin-bottom: 7px; }
  .agent-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 1px; margin-bottom: 4px; }
  .agent-name.exc { color: var(--exc); }
  .agent-name.car { color: var(--car); }
  .agent-name.mot { color: var(--mot); }
  .agent-name.tra { color: var(--tra); }
  .agent-desc { font-size: 10px; color: var(--text-dim); line-height: 1.4; }

  .agent-active-bar {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 13px; margin-bottom: 14px;
    display: none; align-items: center; gap: 10px;
  }
  .agent-active-bar.visible { display: flex; }
  .agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .agent-dot.exc { background: var(--exc); box-shadow: 0 0 6px var(--exc); }
  .agent-dot.car { background: var(--car); box-shadow: 0 0 6px var(--car); }
  .agent-dot.mot { background: var(--mot); box-shadow: 0 0 6px var(--mot); }
  .agent-dot.tra { background: var(--tra); box-shadow: 0 0 6px var(--tra); }
  .agent-active-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .agent-active-name.exc { color: var(--exc); }
  .agent-active-name.car { color: var(--car); }
  .agent-active-name.mot { color: var(--mot); }
  .agent-active-name.tra { color: var(--tra); }
  .agent-active-hint { font-size: 10px; color: var(--text-mute); margin-left: auto; }

  .quick-questions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .quick-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 4px; }
  .quick-q { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 11.5px; color: var(--text-dim); cursor: pointer; text-align: left; font-family: inherit; transition: all .15s; }
  .quick-q:active { border-color: var(--yellow); color: var(--text); }

  .chat-history { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .bubble { border-radius: 10px; padding: 11px 13px; font-size: 12.5px; line-height: 1.55; }
  .bubble.user { background: rgba(255,184,28,.1); border: 1px solid rgba(255,184,28,.2); color: var(--text); margin-left: 20px; }
  .bubble.agent { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); }
  .bubble.agent.exc { border-left: 3px solid var(--exc); }
  .bubble.agent.car { border-left: 3px solid var(--car); }
  .bubble.agent.mot { border-left: 3px solid var(--mot); }
  .bubble.agent.tra { border-left: 3px solid var(--tra); }
  .bubble .agent-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 6px; }
  .bubble .agent-label.exc { color: var(--exc); }
  .bubble .agent-label.car { color: var(--car); }
  .bubble .agent-label.mot { color: var(--mot); }
  .bubble .agent-label.tra { color: var(--tra); }
  .bubble strong { color: var(--yellow); }

  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-mute); animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }

  /* INPUT CHAT FIXO */
  .chat-input-wrap {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    padding: 12px 20px 16px;
    background: rgba(10,14,20,.97); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: none;
  }
  .chat-input-wrap.visible { display: block; }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-textarea {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px; color: var(--text);
    font-family: inherit; font-size: 13px; outline: none; resize: none;
    transition: border-color .15s; max-height: 100px; min-height: 42px; line-height: 1.4;
  }
  .chat-textarea:focus { border-color: var(--yellow); }
  .chat-textarea::placeholder { color: var(--text-mute); }
  .chat-send {
    background: var(--yellow); border: none; border-radius: 10px;
    width: 42px; height: 42px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .15s;
  }
  .chat-send:disabled { background: var(--border); cursor: not-allowed; }
  .chat-send:not(:disabled):active { transform: scale(.95); }
  .chat-send svg { width: 18px; height: 18px; }

  .source-note { font-size: 9.5px; color: var(--text-mute); text-align: center; padding: 6px; letter-spacing: .5px; }
  .footer { padding: 20px; text-align: center; color: var(--text-mute); font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; }
  .footer span { color: var(--yellow); }

  /* PASSWORD OVERLAY */
  .password-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,14,20,.97);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center; justify-content: center;
    padding: 30px;
  }
  .password-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; width: 100%; max-width: 340px; text-align: center;
  }
  .password-icon { font-size: 36px; margin-bottom: 12px; }
  .password-title { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 1px; color: var(--yellow); margin-bottom: 6px; }
  .password-desc { font-size: 12px; color: var(--text-mute); margin-bottom: 20px; line-height: 1.5; }
  .password-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; color: var(--text); font-family: inherit; font-size: 16px;
    text-align: center; letter-spacing: 4px; outline: none; margin-bottom: 10px; transition: border-color .15s;
  }
  .password-input:focus { border-color: var(--yellow); }
  .password-btn {
    width: 100%; background: var(--yellow); color: #000; border: none; padding: 14px; border-radius: 10px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer; transition: all .15s;
  }
  .password-btn:active { transform: scale(.98); }
  .password-error { font-size: 11px; color: #ef4444; margin-top: 8px; display: none; }
  .password-cancel {
    background: none; border: none; color: var(--text-mute); font-size: 11px;
    margin-top: 12px; cursor: pointer; font-family: inherit; display: block; width: 100%;
  }

  /* MODELO SELECTOR */
  .model-selector { margin-bottom: 12px; }
  .model-selector-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 6px; }
  .model-pills { display: flex; gap: 5px; flex-wrap: wrap; }
  .model-pill {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 600;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }

// ============================= CATEGORIA =============================

function fmt(val, unit) {
  if (val === null || val === undefined) return null;
  if (typeof val === 'object' && val.min !== undefined) {
    if (val.min === val.max) return val.min + (unit||'');
    return val.min + '–' + val.max + (unit||'');
  }
  return val + (unit||'');
}

function buildCompareRows(km, jd, cat) {
  const specs = [];

  if (cat === 'escavadeira') {
    specs.push(['Peso operacional', fmt(km.peso_operacional_kg,' kg'), fmt(jd.peso_operacional_kg,' kg')]);
    specs.push(['Potência líquida', km.motor?.potencia_liquida_hp ? km.motor.potencia_liquida_hp+' HP' : '—', jd.motor?.potencia_liquida_hp ? jd.motor.potencia_liquida_hp+' HP' : '—']);
    specs.push(['Cilindrada', km.motor?.cilindrada_L ? km.motor.cilindrada_L+' L' : '—', jd.motor?.cilindrada_L ? jd.motor.cilindrada_L+' L' : '—']);
    specs.push(['Capacidade caçamba', fmt(km.capacidade_cacamba_m3,' m³'), fmt(jd.capacidade_cacamba_m3,' m³')]);
    specs.push(['Força escav. caçamba', km.forca_escavacao_cacamba_kN ? km.forca_escavacao_cacamba_kN+' kN' : '—', jd.forca_escavacao_cacamba_kN ? jd.forca_escavacao_cacamba_kN+' kN' : '—']);
    specs.push(['Força escav. braço', km.forca_fechamento_braco_kN ? km.forca_fechamento_braco_kN+' kN' : '—', jd.forca_fechamento_braco_kN ? jd.forca_fechamento_braco_kN+' kN' : '—']);
    specs.push(['Prof. máx. escavação', km.profundidade_max_escavacao_mm ? (km.profundidade_max_escavacao_mm/1000).toFixed(2)+' m' : '—', jd.profundidade_max_escavacao_mm ? (jd.profundidade_max_escavacao_mm/1000).toFixed(2)+' m' : '—']);
    specs.push(['Alcance máx.', km.alcance_max_escavacao_mm ? (km.alcance_max_escavacao_mm/1000).toFixed(2)+' m' : '—', jd.alcance_max_escavacao_mm ? (jd.alcance_max_escavacao_mm/1000).toFixed(2)+' m' : '—']);
    specs.push(['Tanque combustível', km.tanque_combustivel_L ? km.tanque_combustivel_L+' L' : '—', jd.tanque_combustivel_L ? jd.tanque_combustivel_L+' L' : '—']);
    specs.push(['Motor', km.motor?.modelo || '—', jd.motor?.modelo || '—']);
  } else if (cat === 'carregadeira') {
    specs.push(['Peso operacional', fmt(km.peso_operacional_kg,' kg'), fmt(jd.peso_operacional_kg,' kg')]);
    specs.push(['Potência líquida', km.motor?.potencia_liquida_hp ? km.motor.potencia_liquida_hp+' HP' : '—', jd.motor?.potencia_liquida_hp ? jd.motor.potencia_liquida_hp+' HP' : '—']);
    specs.push(['Cilindrada', km.motor?.cilindrada_L ? km.motor.cilindrada_L+' L' : '—', jd.motor?.cilindrada_L ? jd.motor.cilindrada_L+' L' : '—']);
    specs.push(['Capacidade caçamba', fmt(km.capacidade_cacamba_m3,' m³'), fmt(jd.capacidade_cacamba_m3,' m³')]);
    specs.push(['Força arrancamento', km.forca_arrancamento_kN ? km.forca_arrancamento_kN+' kN' : '—', jd.forca_arrancamento_kN ? jd.forca_arrancamento_kN+' kN' : '—']);
    specs.push(['Altura max. despejo', km.altura_max_despejo_mm ? (km.altura_max_despejo_mm/1000).toFixed(2)+' m' : '—', jd.altura_max_despejo_mm ? (jd.altura_max_despejo_mm/1000).toFixed(2)+' m' : '—']);
    specs.push(['Vel. máx.', km.velocidade_max_kmh ? km.velocidade_max_kmh+' km/h' : '—', jd.velocidade_max_kmh ? jd.velocidade_max_kmh+' km/h' : '—']);
    specs.push(['Tanque combustível', km.tanque_combustivel_L ? km.tanque_combustivel_L+' L' : '—', jd.tanque_combustivel_L ? jd.tanque_combustivel_L+' L' : '—']);
    specs.push(['Motor', km.motor?.modelo || '—', jd.motor?.modelo || '—']);
  } else if (cat === 'motoniveladora') {
    specs.push(['Peso base', km.peso_base_kg ? km.peso_base_kg+' kg' : (km.peso_operacional_kg?.min ? km.peso_operacional_kg.min+' kg' : '—'), jd.peso_base_kg ? jd.peso_base_kg+' kg' : '—']);
    specs.push(['Potência líquida', km.motor?.potencia_liquida_hp ? km.motor.potencia_liquida_hp+' HP' : '—', jd.motor?.potencia_liquida_hp_max ? jd.motor.potencia_liquida_hp_max+' HP' : '—']);
    specs.push(['Cilindrada', km.motor?.cilindrada_L ? km.motor.cilindrada_L+' L' : '—', jd.motor?.cilindrada_L ? jd.motor.cilindrada_L+' L' : '—']);
    specs.push(['Tração', km.tracao || '—', jd.tracao || '—']);
    specs.push(['Comprimento lâmina', km.lamina_mm ? (km.lamina_mm/1000).toFixed(2)+' m' : '—', jd.lamina_m ? jd.lamina_m+' m' : '—']);
    specs.push(['Tanque combustível', km.tanque_combustivel_L ? km.tanque_combustivel_L+' L' : '—', jd.tanque_combustivel_L ? jd.tanque_combustivel_L+' L' : '—']);
    specs.push(['Vel. máx.', km.velocidade_max_kmh ? km.velocidade_max_kmh+' km/h' : '—', jd.velocidade_max_kmh ? jd.velocidade_max_kmh+' km/h' : '—']);
    specs.push(['Motor', km.motor?.modelo || '—', jd.motor?.modelo || '—']);
  } else if (cat === 'trator_esteira') {
    specs.push(['Peso operacional', fmt(km.peso_operacional_kg,' kg'), fmt(jd.peso_operacional_kg,' kg')]);
    specs.push(['Potência líquida', km.motor?.potencia_liquida_hp ? km.motor.potencia_liquida_hp+' HP' : '—', jd.motor?.potencia_liquida_hp ? jd.motor.potencia_liquida_hp+' HP' : '—']);
    specs.push(['Cilindrada', km.motor?.cilindrada_L ? km.motor.cilindrada_L+' L' : '—', jd.motor?.cilindrada_L ? jd.motor.cilindrada_L+' L' : '—']);
    specs.push(['Força de tração', km.forca_tracao_kN ? km.forca_tracao_kN+' kN' : '—', jd.forca_tracao_kN ? jd.forca_tracao_kN+' kN' : '—']);
    specs.push(['Lâmina', km.lamina_mm ? (km.lamina_mm/1000).toFixed(2)+' m' : '—', '—']);
    specs.push(['Tanque combustível', km.tanque_combustivel_L ? km.tanque_combustivel_L+' L' : '—', jd.tanque_combustivel_L ? jd.tanque_combustivel_L+' L' : '—']);
    specs.push(['Vel. máx. frente', km.velocidade_max_kmh?.frente ? km.velocidade_max_kmh.frente+' km/h' : '—', jd.velocidade_max_kmh?.frente ? jd.velocidade_max_kmh.frente+' km/h' : '—']);
    specs.push(['Motor', km.motor?.modelo || '—', jd.motor?.modelo || '—']);
  }

  return specs.map(([label, kv, jv]) => `
    <div class="compare-row">
      <div class="cell label">${label}</div>
      <div class="cell value${!kv||kv==='—'?' empty':''}">${kv||'—'}</div>
      <div class="cell value${!jv||jv==='—'?' empty':''}">${jv||'—'}</div>

}

function goBack() {
  document.getElementById('screen-result').classList.remove('active');
  document.getElementById('screen-select').classList.add('active');
  window.scrollTo(0,0);
}

// ============================= TABS =============================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  ['screen-select','screen-result','screen-search','screen-agents'].forEach(s => {
    const el = document.getElementById(s);
    if(el) el.classList.remove('active');
  });
  document.getElementById('chatInputWrap').classList.remove('visible');

  if (tab==='compare') {
    document.getElementById('screen-select').classList.add('active');
  } else if (tab==='search') {
    document.getElementById('screen-search').classList.add('active');
    setTimeout(()=>document.getElementById('searchInput').focus(),100);
  } else if (tab==='agents') {
    if (!agentUnlocked) {
      document.getElementById('screen-agents').classList.add('active');
      document.getElementById('passwordOverlay').style.display='flex';
      setTimeout(()=>document.getElementById('passwordInput').focus(),100);
    } else {
      document.getElementById('screen-agents').classList.add('active');
      if (activeAgent) document.getElementById('chatInputWrap').classList.add('visible');
    }
  }
  window.scrollTo(0,0);
}

// ============================= SENHA =============================
function checkAgentPassword() {
  const input = document.getElementById('passwordInput');
  const error = document.getElementById('passwordError');
  if (input.value.trim() === AGENT_PASSWORD) {
    agentUnlocked = true;
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('screen-agents').classList.add('active');
    if (activeAgent) document.getElementById('chatInputWrap').classList.add('visible');
    input.value=''; error.style.display='none';
  } else {
    error.style.display='block'; input.value=''; input.focus();
  }
}

// ============================= SEARCH =============================
function buildSearchChips() {
  const el = document.getElementById('searchChips');
  const chips = ['all', ...Object.keys(machinesData)];
  el.innerHTML = chips.map(k => {
    const label = k==='all' ? 'Todas' : (categoryConfig[k]?.label || k);
    return `<button class="chip${k===searchFilter?' active':''}" onclick="setSearchFilter('${k}')">${label}</button>`;
  }).join('');
}

function setSearchFilter(f) {
  searchFilter = f;
  buildSearchChips();
  runSearch(document.getElementById('searchInput').value);
}

function normalize(s) { return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function runSearch(query) {
  const el = document.getElementById('searchResults');
  const clr = document.getElementById('searchClear');
  const q = normalize(query.trim());

  if (!q) {
    clr.classList.remove('visible');
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔎</div><strong style="color:var(--text-dim)">Busca livre na base de dados</strong><br><span style="font-size:11px">Modelo · Spec · Categoria · Valor</span><div class="suggest-list"><button class="suggest" onclick="suggestSearch('SAA6D107')">SAA6D107</button><button class="suggest" onclick="suggestSearch('KOMTRAX')">KOMTRAX</button><button class="suggest" onclick="suggestSearch('hidráulico')">hidráulico</button><button class="suggest" onclick="suggestSearch('PowerTech')">PowerTech</button><button class="suggest" onclick="suggestSearch('4WD')">4WD</button><button class="suggest" onclick="suggestSearch('Stone Handler')">Stone Handler</button></div></div>`;
    return;
  }
  clr.classList.add('visible');

  const results = [];
  const cats = searchFilter==='all' ? Object.keys(machinesData) : [searchFilter];

  cats.forEach(catKey => {
    const cat = machinesData[catKey];
    if (!cat) return;
    const catLabel = categoryConfig[catKey]?.label || catKey;
    ['komatsu','john_deere'].forEach(brand => {
      (cat.machines[brand]||[]).forEach(m => {
        const flat = flattenObj(m);
        const hits = [];
        Object.entries(flat).forEach(([k,v]) => {
          if (normalize(k).includes(q) || normalize(String(v)).includes(q)) {
            hits.push({label:k, value:String(v)});
          }
        });
        if (hits.length || normalize(m.modelo).includes(q) || normalize(brand).includes(q)) {
          results.push({catKey, catLabel, brand, m, hits});
        }
      });
    });
  });

  if (!results.length) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">∅</div>Nenhum resultado para "<strong style="color:var(--text-dim)">${query}</strong>"</div>`; return; }

  let html = `<div class="results-count"><span>${results.length}</span> máquinas encontradas</div>`;
  results.slice(0,20).forEach(({catLabel, brand, m, hits}) => {
    const brandTag = brand==='komatsu' ? '<span class="brand-tag komatsu">Komatsu</span>' : '<span class="brand-tag john_deere">John Deere</span>';
    const shownHits = hits.slice(0,5).map(h => `<div class="spec-hit"><span class="spec-hit-label">${h.label}</span><span class="spec-hit-value">${h.value}</span></div>`).join('');
    html += `<div class="search-card"><div class="search-card-head">${brandTag}<div class="m-cat">${catLabel}</div><div class="m-model">${m.modelo}</div></div>${shownHits||'<div class="m-meta" style="color:var(--text-mute);font-size:11px">Correspondência no nome do modelo</div>'}</div>`;
  });
  el.innerHTML = html;
}

function flattenObj(obj, prefix='') {
  const result = {};
  Object.entries(obj||{}).forEach(([k,v]) => {
    const key = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v==='object' && !Array.isArray(v)) {
      Object.assign(result, flattenObj(v, key));
    } else if (Array.isArray(v)) {
      result[key] = v.join(', ');
    } else {
      result[key] = v;
    }
  });
  return result;
}

function clearSearch() { document.getElementById('searchInput').value=''; runSearch(''); document.getElementById('searchInput').focus(); }
function suggestSearch(t) { document.getElementById('searchInput').value=t; runSearch(t); }

// ============================= AGENTES =============================
function buildAgentsGrid() {
  const el = document.getElementById('agentsGrid');
  el.innerHTML = Object.keys(categoryConfig).map(cat => {
    const cfg = categoryConfig[cat];
    return `
      <button class="agent-card ${cfg.color}" id="agent-${cfg.color}" onclick="selectAgent('${cat}')">
        <div class="agent-icon">${cfg.icon}</div>
        <div class="agent-name ${cfg.color}">${cfg.label.toUpperCase()}</div>
        <div class="agent-desc">Consulte qualquer modelo Komatsu ou John Deere desta categoria.</div>
      </button>`;
  }).join('');
}

function selectAgent(catKey) {
  if (!agentUnlocked) return;
  activeAgent = catKey;
  chatMessages = [];
  agentSelectedModels = { komatsu: null, jd: null };

  const cfg = categoryConfig[catKey];
  document.querySelectorAll('.agent-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`agent-${cfg.color}`).classList.add('active');

  const bar = document.getElementById('agentBar');
  bar.classList.add('visible');
  document.getElementById('agentDot').className = `agent-dot ${cfg.color}`;
  const nameEl = document.getElementById('agentName');
  nameEl.className = `agent-active-name ${cfg.color}`;
  nameEl.textContent = `AGENTE ${cfg.label.toUpperCase()}`;

  document.getElementById('agentWelcome').style.display='none';
  document.getElementById('chatHistory').innerHTML='';

  // Model selectors
  renderAgentModelSelectors(catKey);

  const qb = document.getElementById('quickBlock');
  const ql = document.getElementById('quickList');
  qb.style.display='block';
  const qs = agentQuickQ[cfg.agentType] || [];
  ql.innerHTML = qs.map(q=>`<button class="quick-q" onclick="useQuickQ('${q.replace(/'/g,"\\'")}')">💬 ${q}</button>`).join('');

  document.getElementById('chatInputWrap').classList.add('visible');
  document.getElementById('chatTextarea').focus();
}

function renderAgentModelSelectors(catKey) {
  const el = document.getElementById('agentModelSelectors');
  const cat = machinesData[catKey];
  if (!cat) { el.style.display='none'; return; }
  const km = cat.machines.komatsu || [];
  const jd = cat.machines.john_deere || [];

  // default: first of each
  if (!agentSelectedModels.komatsu && km.length) agentSelectedModels.komatsu = km[0].id;
  if (!agentSelectedModels.jd && jd.length) agentSelectedModels.jd = jd[0].id;

  el.style.display='block';
  el.innerHTML = `
    <div class="model-selector">
      <div class="model-selector-label">Komatsu — modelo consultado</div>
      <div class="model-pills">
        ${km.map(m=>`<button class="model-pill${agentSelectedModels.komatsu===m.id?' active':''}" onclick="setAgentModel('komatsu','${m.id}','${catKey}')">${m.modelo}</button>`).join('')}
      </div>
    </div>
    <div class="model-selector" style="margin-bottom:14px">
      <div class="model-selector-label">John Deere — modelo consultado</div>
      <div class="model-pills">
        ${jd.map(m=>`<button class="model-pill${agentSelectedModels.jd===m.id?' active':''}" onclick="setAgentModel('jd','${m.id}','${catKey}')">${m.modelo}</button>`).join('')}
      </div>
    </div>`;
}

function setAgentModel(brand, id, catKey) {
  agentSelectedModels[brand] = id;
  renderAgentModelSelectors(catKey);
}

function buildSystemPrompt(catKey) {
  const cfg = categoryConfig[catKey];
  const cat = machinesData[catKey];
  const kmId = agentSelectedModels.komatsu;
  const jdId = agentSelectedModels.jd;
  const kmMachine = (cat?.machines?.komatsu||[]).find(m=>m.id===kmId);
  const jdMachine = (cat?.machines?.john_deere||[]).find(m=>m.id===jdId);

  return `Você é um especialista técnico em ${cfg.label}, apoiando um consultor de vendas Komatsu em negociação.

MODELOS SELECIONADOS:
- Komatsu: ${kmMachine?.modelo || 'não selecionado'}
- John Deere: ${jdMachine?.modelo || 'não selecionado'}

DADOS KOMATSU (${kmMachine?.modelo||''}):
${JSON.stringify(kmMachine, null, 2)}

DADOS JOHN DEERE (${jdMachine?.modelo||''}):
${JSON.stringify(jdMachine, null, 2)}

REGRAS:
- Responda SEMPRE em português brasileiro
- Seja DIRETO e CONCISO — o consultor está na frente do cliente
- Use os dados acima primeiro. Se não encontrar, informe que não consta no prospecto
- Destaque diferenças que favorecem a Komatsu quando relevante
- Máximo 5 linhas de resposta
- Use **negrito** para números e diferenciais chave
- Sem introdução longa, sem conclusão redundante`;
}

function useQuickQ(q) {
  document.getElementById('chatTextarea').value=q;
  sendMessage();
}

async function sendMessage() {
  if (isLoading || !activeAgent) return;
  const ta = document.getElementById('chatTextarea');
  const msg = ta.value.trim();
  if (!msg) return;

  ta.value=''; ta.style.height='auto';
  isLoading=true;
  document.getElementById('chatSend').disabled=true;
  document.getElementById('quickBlock').style.display='none';

  chatMessages.push({role:'user', content:msg});
  renderChat();

  const hist = document.getElementById('chatHistory');
  const cfg = categoryConfig[activeAgent];
  const typingEl = document.createElement('div');
  typingEl.className=`bubble agent ${cfg.color}`;
  typingEl.innerHTML=`<div class="agent-label ${cfg.color}">AGENTE ${cfg.label.toUpperCase()}</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  hist.appendChild(typingEl);
  hist.scrollTop=hist.scrollHeight;

  try {
    const res = await fetch('/.netlify/functions/agent', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({systemPrompt: buildSystemPrompt(activeAgent), messages: chatMessages})
    });
    const data = await res.json();
    const reply = data.reply || data.error || 'Erro ao processar resposta.';
    chatMessages.push({role:'assistant', content:reply});
    typingEl.remove();
    renderChat();
  } catch(err) {
    typingEl.remove();
    chatMessages.push({role:'assistant', content:'⚠ Erro de conexão. Tente novamente.'});
    renderChat();
  }

  isLoading=false;
  document.getElementById('chatSend').disabled=false;
  document.getElementById('chatTextarea').focus();
}

function renderChat() {
  const hist = document.getElementById('chatHistory');
  const cfg = categoryConfig[activeAgent];
  hist.innerHTML='';
  chatMessages.forEach(m => {
    const el = document.createElement('div');
    if (m.role==='user') {
      el.className='bubble user';
      el.textContent=m.content;
    } else {
      el.className=`bubble agent ${cfg.color}`;
      el.innerHTML=`<div class="agent-label ${cfg.color}">AGENTE ${cfg.label.toUpperCase()}</div>${m.content.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}`;
    }
    hist.appendChild(el);
  });
  hist.scrollTop=hist.scrollHeight;
}

init();
</script>
